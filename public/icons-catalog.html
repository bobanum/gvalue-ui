<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catalogue des icônes</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 1.5rem;
            background: #f5f5f7;
            color: #1a1a1a;
        }

        h1 {
            margin-top: 0;
        }

        .search {
            margin-bottom: 1.5rem;
        }

        .search input {
            width: 100%;
            max-width: 24rem;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 0.4rem;
        }

        section.category {
            margin-bottom: 2rem;
        }

        section.category h2 {
            text-transform: capitalize;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.4rem;
        }

        .count {
            font-weight: normal;
            color: #777;
            font-size: 0.85rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr));
            gap: 0.75rem;
        }

        .icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            padding: 0.75rem 0.5rem;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 0.5rem;
            text-align: center;
        }

        .icon-card svg {
            width: 2.5rem;
            height: 2.5rem;
            color: #333;
        }

        .icon-card .id {
            font-size: 0.7rem;
            word-break: break-all;
            color: #555;
        }

        .icon-card.hidden {
            display: none;
        }

        #status {
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>Catalogue des icônes</h1>
    <p id="status">Chargement de icons.svg…</p>
    <div class="search">
        <input type="search" id="filter" placeholder="Filtrer par nom d'icône…" disabled>
    </div>
    <div id="categories"></div>

    <script type="module">
        const statusEl = document.getElementById('status');
        const categoriesEl = document.getElementById('categories');
        const filterEl = document.getElementById('filter');

        async function loadIcons() {
            const response = await fetch('icons.svg');
            if (!response.ok) {
                throw new Error(`Impossible de charger icons.svg (${response.status})`);
            }
            const svgText = await response.text();
            const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
            if (doc.querySelector('parsererror')) {
                throw new Error('icons.svg contient une erreur XML.');
            }
            return doc;
        }

        function renderCategories(doc) {
            const defsList = Array.from(doc.querySelectorAll('defs[id]'));
            if (defsList.length === 0) {
                statusEl.textContent = 'Aucun bloc <defs id="…"> trouvé dans icons.svg.';
                return;
            }

            for (const defs of defsList) {
                const symbols = Array.from(defs.querySelectorAll('symbol[id]'));
                if (symbols.length === 0) continue;

                const name = defs.id.replace(/-defs$/, '');

                const section = document.createElement('section');
                section.className = 'category';

                const heading = document.createElement('h2');
                heading.textContent = name;
                const count = document.createElement('span');
                count.className = 'count';
                count.textContent = ` (${symbols.length})`;
                heading.appendChild(count);
                section.appendChild(heading);

                const grid = document.createElement('div');
                grid.className = 'grid';

                for (const symbol of symbols) {
                    const card = document.createElement('div');
                    card.className = 'icon-card';
                    card.dataset.id = symbol.id;

                    card.innerHTML = `
                        <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#${symbol.id}"/></svg>
                        <span class="id">${symbol.id}</span>
                    `;
                    grid.appendChild(card);
                }

                section.appendChild(grid);
                categoriesEl.appendChild(section);
            }

            statusEl.remove();
        }

        function setupFilter() {
            filterEl.disabled = false;
            filterEl.addEventListener('input', () => {
                const term = filterEl.value.trim().toLowerCase();
                const cards = categoriesEl.querySelectorAll('.icon-card');
                for (const card of cards) {
                    const match = !term || card.dataset.id.toLowerCase().includes(term);
                    card.classList.toggle('hidden', !match);
                }
                const sections = categoriesEl.querySelectorAll('section.category');
                for (const section of sections) {
                    const visible = section.querySelectorAll('.icon-card:not(.hidden)').length;
                    section.style.display = visible === 0 ? 'none' : '';
                }
            });
        }

        loadIcons()
            .then((doc) => {
                // Inclure le SVG complet (masqué) pour que les <use href="#id"> résolvent les symboles.
                const hiddenSvg = doc.documentElement.cloneNode(true);
                hiddenSvg.style.position = 'absolute';
                hiddenSvg.style.width = '0';
                hiddenSvg.style.height = '0';
                hiddenSvg.style.overflow = 'hidden';
                document.body.prepend(hiddenSvg);

                renderCategories(doc);
                setupFilter();
            })
            .catch((err) => {
                statusEl.textContent = `Erreur : ${err.message}`;
            });
    </script>
</body>
</html>
